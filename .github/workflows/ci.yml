# Intégration continue d'AI Clip Studio.
# Toute vérification obligatoire qui échoue fait échouer la CI.
# Aucun secret n'est nécessaire : la CI n'appelle jamais de service payant (Claude API).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'
      - 'ci/**'
      - 'chore/**'
  workflow_dispatch:

# Moindre privilège : lecture seule du dépôt.
permissions:
  contents: read

# Une nouvelle exécution annule la précédente sur la même branche / PR (sauf sur main).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: '1'

jobs:
  quality:
    name: Qualité (TypeScript, lint, format)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatage
        run: npm run format:check

  unit:
    name: Tests unitaires (dont interface, jsdom)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  migrations:
    name: Migrations de base de données
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Migrations (base neuve, reprise de données, verrouillage des migrations publiées)
        run: npm run test:migrations

  integration:
    name: Tests d'intégration (FFmpeg)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: npm ci
      - name: Tests d'intégration (échec si FFmpeg absent)
        run: npm run test:integration
        env:
          REQUIRE_FFMPEG: '1'

  e2e:
    name: Éditeur de bout en bout (Playwright, Chromium)
    # API réelle (FFmpeg, transcription simulée, faux modèle : aucun appel à Claude), interface
    # servie par Vite, Chromium dont la version est fixée par celle de Playwright.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -version | head -1
      - run: npm ci
      - name: Installer Chromium (version fixée par Playwright)
        run: npx playwright install --with-deps chromium
      - name: Parcours de l'éditeur (Playwright)
        run: npm run test:e2e

  build:
    name: Build et démarrage de l'API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build de l'interface
        run: npm run build:web
      - name: Démarrage réel de l'API (/api/health)
        run: npm run smoke

  windows:
    name: Windows (tests et démarrage)
    # Machine de production du créateur : Windows. Exécuté sur les PR et sur main.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer FFmpeg
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version | Select-Object -First 1
      - run: npm ci
      - name: Tests unitaires
        run: npm run test:unit
      - name: Tests d'intégration
        run: npm run test:integration
        env:
          REQUIRE_FFMPEG: '1'
      - name: Démarrage réel de l'API
        run: npm run smoke

  python:
    name: Worker Python (pytest + vrai modèle tiny sur CPU)
    # Pas de GPU sur les runners GitHub : ce job ne valide PAS la transcription GPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ACS_WHISPER_REAL: '1'
      ACS_WHISPER_MODEL_DIR: ${{ github.workspace }}/.whisper-models
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: packages/transcription/python/requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer FFmpeg (avec flite pour la parole de synthèse)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg
          ffmpeg -hide_banner -filters | grep -q flite
      - name: Dépendances Python
        run: python -m pip install -r packages/transcription/python/requirements-dev.txt
      - name: Cache du modèle Whisper tiny
        uses: actions/cache@v4
        with:
          path: .whisper-models
          key: whisper-models-tiny-v1
      - name: Tests du worker (faux modèle + vrai modèle tiny)
        working-directory: packages/transcription/python
        run: python -m pytest -v
      - run: npm ci
      - name: Bout en bout Node ↔ vrai worker Python
        run: npx vitest run --project unit packages/transcription/src/worker-client.real.test.ts
        env:
          ACS_PYTHON: python

  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Installer gitleaks (somme de contrôle vérifiée)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" '$2 == f { print $1 "  gitleaks.tar.gz" }' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Analyse de tout l'historique
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --no-banner
